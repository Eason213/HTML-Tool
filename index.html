<!doctype html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="HTML Space" />
  <meta name="theme-color" content="#050508" />
  <link rel="manifest" href="/manifest.json" />
  <title>HTML Space Studio - iOS 27</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050508; color: #ffffff; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    .animate-fadeIn { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-[#050508] text-white antialiased selection:bg-blue-500 selection:text-white">
  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- IndexedDB 儲存引擎 ---
    const DB_NAME = 'iOS27_HTML_DB';
    const STORE_NAME = 'history';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveRecordToDB = async (record) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getAllRecordsFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).getAll();
        request.onsuccess = () => {
          const raw = request.result || [];
          const normalized = raw.map(item => {
            if (!item.files || !Array.isArray(item.files)) {
              return {
                ...item,
                category: item.category || '預設工具箱',
                files: [{ name: item.fileName || 'index.html', content: item.content || '' }]
              };
            }
            return item;
          });
          const sorted = normalized.sort((a, b) => b.lastOpened - a.lastOpened);
          resolve(sorted);
        };
        request.onerror = () => reject(request.error);
      });
    };

    const deleteRecordFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // --- 零正則安全打包引擎：自動將專案內的 .html, .css, .js 組合成單一可執行畫面 ---
    const bundleProjectFiles = (project) => {
      const files = project.files || [];
      if (files.length === 0) {
        return '<div style="background:#111;color:#fff;padding:40px;text-align:center;font-family:sans-serif;">專案內尚無檔案，請點擊右下角「編輯檔案」新增程式碼</div>';
      }

      // 找出主 HTML 檔
      let entryFile = files.find(f => f.name.toLowerCase() === 'index.html')
                   || files.find(f => f.name.toLowerCase().endsWith('.html') || f.name.toLowerCase().endsWith('.htm'))
                   || files[0];

      let html = entryFile.content || '';
      let extraStyles = '';
      let extraScripts = '';

      files.forEach(file => {
        if (file.name === entryFile.name) return;
        const lower = file.name.toLowerCase();
        if (lower.endsWith('.css')) {
          extraStyles += '\n/* ' + file.name + ' */\n' + (file.content || '');
        } else if (lower.endsWith('.js')) {
          extraScripts += '\n/* ' + file.name + ' */\n' + (file.content || '');
        } else {
          // 其他附屬檔案轉為 Blob URL 替換路徑
          const blob = new Blob([file.content || ''], { type: 'text/plain' });
          const url = URL.createObjectURL(blob);
          html = html.split('./' + file.name).join(url);
          html = html.split(file.name).join(url);
        }
      });

      const styleOpen = '<st' + 'yle>';
      const styleClose = '</st' + 'yle>';
      const scriptOpen = '<scr' + 'ipt>';
      const scriptClose = '</scr' + 'ipt>';

      if (extraStyles) {
        const styleBlock = styleOpen + extraStyles + styleClose;
        if (html.includes('</head>')) {
          html = html.replace('</head>', styleBlock + '</head>');
        } else {
          html = styleBlock + html;
        }
      }

      if (extraScripts) {
        const scriptBlock = scriptOpen + extraScripts + scriptClose;
        if (html.includes('</body>')) {
          html = html.replace('</body>', scriptBlock + '</body>');
        } else {
          html = html + scriptBlock;
        }
      }

      return html;
    };

    const calcProjectSize = (files) => {
      const totalBytes = (files || []).reduce((acc, f) => acc + new Blob([f.content || '']).size, 0);
      return (totalBytes / 1024).toFixed(1) + ' KB';
    };

    const stripHtmlExt = (name) => {
      if (name.toLowerCase().endsWith('.html')) return name.slice(0, -5);
      if (name.toLowerCase().endsWith('.htm')) return name.slice(0, -4);
      return name;
    };

    // --- 內建 SVG 圖示元件 ---
    const IconFolderPlus = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" /></svg>
    );
    const IconFolder = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
    );
    const IconCode = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
    );
    const IconFile = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
    );
    const IconClock = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6l4 2" /></svg>
    );
    const IconTrash = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    );
    const IconEdit = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
    );
    const IconPlay = () => (
      <svg className="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
    );
    const IconPlus = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
    );
    const IconX = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    );
    const IconChevronLeft = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>
    );
    const IconSparkles = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
    );

    function App() {
      const [history, setHistory] = useState([]);
      const [activeProject, setActiveProject] = useState(null);
      const [studioProject, setStudioProject] = useState(null);
      const [showNewProjectModal, setShowNewProjectModal] = useState(false);
      const [newProjectTitle, setNewProjectTitle] = useState('');
      const [newProjectCategory, setNewProjectCategory] = useState('預設工具箱');

      const [showFileEditor, setShowFileEditor] = useState(false);
      const [editingFileIndex, setEditingFileIndex] = useState(null);
      const [fileNameInput, setFileNameInput] = useState('');
      const [fileContentInput, setFileContentInput] = useState('');
      const [miniFloatingBtn, setMiniFloatingBtn] = useState(false);

      const quickFileInputRef = useRef(null);
      const projectFileInputRef = useRef(null);

      useEffect(() => {
        loadHistory();
      }, []);

      const loadHistory = async () => {
        const data = await getAllRecordsFromDB();
        setHistory(data);
      };

      // 步驟 1：建立專案並自動開啟第一個檔案貼上視窗
      const handleCreateProject = async () => {
        const title = newProjectTitle.trim() || ('新軟體專案 ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        const newProj = {
          id: Date.now().toString(),
          title: title,
          category: newProjectCategory,
          files: [],
          size: '0.0 KB',
          lastOpened: Date.now(),
        };
        await saveRecordToDB(newProj);
        await loadHistory();
        setNewProjectTitle('');
        setShowNewProjectModal(false);
        setStudioProject(newProj);
        setEditingFileIndex(null);
        setFileNameInput('index.html');
        setFileContentInput('');
        setShowFileEditor(true);
      };

      // 步驟 2：開啟新增或編輯檔案彈窗
      const openFileModal = (index = null) => {
        setEditingFileIndex(index);
        if (index !== null && studioProject && studioProject.files[index]) {
          setFileNameInput(studioProject.files[index].name);
          setFileContentInput(studioProject.files[index].content);
        } else {
          const existingNames = ((studioProject && studioProject.files) || []).map(f => f.name.toLowerCase());
          let suggested = 'index.html';
          if (existingNames.includes('index.html')) {
            if (!existingNames.includes('style.css')) suggested = 'style.css';
            else if (!existingNames.includes('script.js')) suggested = 'script.js';
            else suggested = 'file-' + (existingNames.length + 1) + '.js';
          }
          setFileNameInput(suggested);
          setFileContentInput('');
        }
        setShowFileEditor(true);
      };

      // 步驟 3：儲存檔案到專案中
      const handleSaveFileInStudio = async () => {
        if (!studioProject) return;
        const cleanName = fileNameInput.trim() || ('file-' + ((studioProject.files || []).length + 1) + '.html');
        const updatedFiles = [...(studioProject.files || [])];

        if (editingFileIndex !== null) {
          updatedFiles[editingFileIndex] = { name: cleanName, content: fileContentInput };
        } else {
          updatedFiles.push({ name: cleanName, content: fileContentInput });
        }

        const updatedProject = {
          ...studioProject,
          files: updatedFiles,
          size: calcProjectSize(updatedFiles),
          lastOpened: Date.now(),
        };

        await saveRecordToDB(updatedProject);
        await loadHistory();
        setStudioProject(updatedProject);
        setShowFileEditor(false);
        setFileNameInput('');
        setFileContentInput('');
      };

      // 從手機匯入多個檔案至專案
      const handleImportFilesToStudio = async (e) => {
        const selectedFiles = Array.from(e.target.files || []);
        if (!selectedFiles.length || !studioProject) return;

        const readPromises = selectedFiles.map(file => new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => resolve({ name: file.name, content: ev.target.result });
          reader.readAsText(file);
        }));

        const imported = await Promise.all(readPromises);
        const updatedFiles = [...(studioProject.files || []), ...imported];
        const updatedProject = {
          ...studioProject,
          files: updatedFiles,
          size: calcProjectSize(updatedFiles),
          lastOpened: Date.now(),
        };

        await saveRecordToDB(updatedProject);
        await loadHistory();
        setStudioProject(updatedProject);
        e.target.value = '';
      };

      const handleDeleteFileInStudio = async (idx) => {
        const updatedFiles = studioProject.files.filter((_, i) => i !== idx);
        const updatedProject = {
          ...studioProject,
          files: updatedFiles,
          size: calcProjectSize(updatedFiles),
        };
        await saveRecordToDB(updatedProject);
        await loadHistory();
        setStudioProject(updatedProject);
      };

      // 單檔快速上傳並開啟
      const handleQuickSingleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = event.target.result;
          const files = [{ name: file.name, content: content }];
          const newRecord = {
            id: Date.now().toString(),
            title: stripHtmlExt(file.name),
            category: '單頁工具',
            files: files,
            size: calcProjectSize(files),
            lastOpened: Date.now(),
          };
          await saveRecordToDB(newRecord);
          await loadHistory();
          setActiveProject(newRecord);
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      // 從紀錄清單點擊直接執行
      const openProjectFromHistory = async (item) => {
        const updated = { ...item, lastOpened: Date.now() };
        await saveRecordToDB(updated);
        await loadHistory();
        setMiniFloatingBtn(false);
        setActiveProject(updated);
      };

      const handleDeleteProject = async (e, id) => {
        e.stopPropagation();
        await deleteRecordFromDB(id);
        await loadHistory();
      };

      return (
        <div className="relative w-full h-full overflow-hidden bg-[#050508] select-none font-sans">
          {/* iOS 27 空間極光背景 */}
          <div className="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/30 rounded-full blur-[120px] pointer-events-none animate-pulse" />
          <div className="absolute top-1/3 -right-32 w-96 h-96 bg-purple-600/25 rounded-full blur-[130px] pointer-events-none" />
          <div className="absolute -bottom-32 left-1/4 w-96 h-96 bg-cyan-500/20 rounded-full blur-[110px] pointer-events-none" />

          <input ref={quickFileInputRef} type="file" accept=".html,.htm" onChange={handleQuickSingleFileUpload} className="hidden" />
          <input ref={projectFileInputRef} type="file" multiple accept=".html,.htm,.css,.js,.json,.svg" onChange={handleImportFilesToStudio} className="hidden" />

          {/* 主畫面清單 */}
          {!studioProject && (
            <div className="relative z-10 flex flex-col h-full pt-5 pb-28 px-5 max-w-md mx-auto">
              <header className="mb-5 flex items-center justify-between">
                <div>
                  <div className="flex items-center gap-1.5 text-xs font-medium text-blue-400/90 tracking-widest uppercase mb-1">
                    <IconSparkles />
                    <span>iOS 27 Spatial Studio</span>
                  </div>
                  <h1 className="text-2xl font-bold tracking-tight text-white">
                    HTML 免部署工作站
                  </h1>
                </div>
                <div className="px-3 py-1.5 rounded-full bg-white/10 backdrop-blur-xl border border-white/15 text-xs text-white/80">
                  {history.length} 個軟體
                </div>
              </header>

              <div className="grid grid-cols-2 gap-3.5 mb-6">
                <button
                  onClick={() => setShowNewProjectModal(true)}
                  className="group relative flex flex-col justify-between p-4 h-28 rounded-[28px] bg-gradient-to-br from-blue-500/25 to-purple-600/20 active:scale-95 transition-all backdrop-blur-2xl border border-blue-400/35 shadow-lg text-left"
                >
                  <div className="w-10 h-10 rounded-2xl bg-blue-500/30 border border-blue-400/40 flex items-center justify-center text-blue-300">
                    <IconFolderPlus />
                  </div>
                  <div>
                    <div className="font-semibold text-sm text-white">新增專案</div>
                    <div className="text-[11px] text-blue-200/70">貼上多檔程式碼免部署</div>
                  </div>
                </button>

                <button
                  onClick={() => quickFileInputRef.current && quickFileInputRef.current.click()}
                  className="group relative flex flex-col justify-between p-4 h-28 rounded-[28px] bg-white/[0.08] active:scale-95 transition-all backdrop-blur-2xl border border-white/15 shadow-lg text-left"
                >
                  <div className="w-10 h-10 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 flex items-center justify-center text-emerald-300">
                    <IconFolder />
                  </div>
                  <div>
                    <div className="font-semibold text-sm text-white/95">開啟本機單檔</div>
                    <div className="text-[11px] text-white/50">選取手機內的 .html</div>
                  </div>
                </button>
              </div>

              <div className="flex items-center justify-between mb-3 px-1">
                <div className="flex items-center gap-1.5 text-xs font-semibold text-white/60 tracking-wider uppercase">
                  <IconClock />
                  <span>軟體與專案紀錄清單 (點擊直接執行)</span>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto space-y-3 pr-1 pb-6">
                {history.length === 0 ? (
                  <div className="h-52 rounded-[32px] bg-white/[0.04] backdrop-blur-xl border border-white/10 flex flex-col items-center justify-center text-center p-6">
                    <IconCode className="w-10 h-10 text-white/25 mb-3" />
                    <p className="text-sm text-white/70 font-medium">尚無軟體紀錄</p>
                    <p className="text-xs text-white/40 mt-1">點擊上方「新增專案」，貼上程式碼並命名存檔，後續即可在此清單直接秒開</p>
                  </div>
                ) : (
                  history.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => openProjectFromHistory(item)}
                      className="group relative flex items-center justify-between p-4 rounded-[26px] bg-white/[0.07] hover:bg-white/[0.12] active:scale-[0.98] transition-all backdrop-blur-2xl border border-white/15 shadow-lg cursor-pointer"
                    >
                      <div className="flex items-center gap-3.5 min-w-0 pr-2">
                        <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-500/25 to-purple-500/25 border border-white/15 flex items-center justify-center text-blue-300 shrink-0">
                          <IconPlay />
                        </div>
                        <div className="min-w-0">
                          <div className="flex items-center gap-2">
                            <h3 className="font-semibold text-sm text-white truncate">{item.title}</h3>
                            <span className="px-2 py-0.5 rounded-full bg-blue-500/20 border border-blue-400/30 text-[10px] text-blue-300 shrink-0">
                              {(item.files || []).length} 檔
                            </span>
                          </div>
                          <div className="flex items-center gap-2 text-[11px] text-white/50 mt-1">
                            <span>{item.category || '預設工具箱'}</span>
                            <span>•</span>
                            <span>{item.size}</span>
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-1.5 shrink-0">
                        <button
                          onClick={(e) => { e.stopPropagation(); setStudioProject(item); }}
                          className="p-2.5 rounded-full bg-white/10 hover:bg-blue-500/30 text-white/80 active:scale-90 transition-all"
                          title="管理專案檔案"
                        >
                          <IconEdit />
                        </button>
                        <button
                          onClick={(e) => handleDeleteProject(e, item.id)}
                          className="p-2.5 rounded-full bg-white/5 hover:bg-red-500/20 text-white/40 hover:text-red-400 active:scale-90 transition-all"
                          title="刪除"
                        >
                          <IconTrash />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* 專案多檔案管理工作區 */}
          {studioProject && (
            <div className="relative z-20 flex flex-col h-full pt-5 pb-28 px-5 max-w-md mx-auto animate-fadeIn">
              <div className="flex items-center justify-between mb-5">
                <button
                  onClick={() => setStudioProject(null)}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-white/10 active:scale-95 text-xs font-semibold text-white border border-white/15"
                >
                  <IconChevronLeft />
                  <span>完成並返回最上層</span>
                </button>

                <button
                  onClick={() => openProjectFromHistory(studioProject)}
                  className="flex items-center gap-1.5 px-4 py-2 rounded-full bg-emerald-500 active:scale-95 text-xs font-semibold text-white shadow-lg"
                >
                  <IconPlay />
                  <span>立即開啟執行</span>
                </button>
              </div>

              <div className="p-4 rounded-[28px] bg-white/[0.07] border border-white/15 backdrop-blur-2xl mb-5">
                <div className="text-[11px] text-blue-300 font-medium mb-0.5">儲存位置：{studioProject.category || '預設工具箱'}</div>
                <h2 className="text-xl font-bold text-white truncate">{studioProject.title}</h2>
                <p className="text-xs text-white/60 mt-1">
                  請依序點擊「新增程式碼檔案」貼上並命名（如 index.html、style.css、script.js），完成後返回最上層即可隨時開啟使用。
                </p>
              </div>

              <div className="grid grid-cols-2 gap-3 mb-5">
                <button
                  onClick={() => openFileModal(null)}
                  className="flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl bg-blue-500 active:scale-95 text-white font-semibold text-xs shadow-lg"
                >
                  <IconPlus />
                  <span>新增程式碼檔案</span>
                </button>
                <button
                  onClick={() => projectFileInputRef.current && projectFileInputRef.current.click()}
                  className="flex items-center justify-center gap-2 py-3.5 px-4 rounded-2xl bg-white/10 active:scale-95 text-white font-semibold text-xs border border-white/15"
                >
                  <IconFolder />
                  <span>從手機匯入檔案</span>
                </button>
              </div>

              <div className="text-xs font-semibold text-white/60 tracking-wider uppercase mb-2.5 px-1">
                已建立的專案檔案 ({(studioProject.files || []).length})
              </div>

              <div className="flex-1 overflow-y-auto space-y-2.5 pr-1 pb-6">
                {(studioProject.files || []).length === 0 ? (
                  <div className="h-40 rounded-[28px] bg-white/[0.03] border border-dashed border-white/15 flex flex-col items-center justify-center text-center p-5">
                    <p className="text-sm text-white/60 font-medium">尚未新增檔案</p>
                    <p className="text-xs text-white/40 mt-1">請點上方「＋ 新增程式碼檔案」貼上第一個檔案</p>
                  </div>
                ) : (
                  studioProject.files.map((file, idx) => (
                    <div
                      key={idx}
                      onClick={() => openFileModal(idx)}
                      className="flex items-center justify-between p-3.5 rounded-2xl bg-white/[0.08] border border-white/15 cursor-pointer"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <div className="w-9 h-9 rounded-xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-300 shrink-0">
                          <IconFile />
                        </div>
                        <div className="min-w-0">
                          <div className="text-sm font-semibold text-white truncate">{file.name}</div>
                          <div className="text-[11px] text-white/50">
                            {(new Blob([file.content || '']).size / 1024).toFixed(1)} KB • 點擊編輯內容
                          </div>
                        </div>
                      </div>
                      <button
                        onClick={(e) => { e.stopPropagation(); handleDeleteFileInStudio(idx); }}
                        className="p-2 rounded-full bg-white/5 text-white/40 hover:text-red-400"
                      >
                        <IconTrash />
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* 底部懸浮空間膠囊列 */}
          {!studioProject && (
            <div className="fixed bottom-6 inset-x-0 z-20 flex justify-center pointer-events-none">
              <div className="pointer-events-auto flex items-center gap-2 px-3 py-2 rounded-full bg-white/10 backdrop-blur-3xl border border-white/20 shadow-2xl">
                <button
                  onClick={() => setShowNewProjectModal(true)}
                  className="flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-500 active:scale-95 text-white text-xs font-semibold shadow-lg"
                >
                  <IconPlus />
                  <span>新增專案</span>
                </button>
                <button
                  onClick={() => quickFileInputRef.current && quickFileInputRef.current.click()}
                  className="px-4 py-2.5 rounded-full text-white/85 active:scale-95 text-xs font-medium"
                >
                  開啟單檔
                </button>
              </div>
            </div>
          )}

          {/* 彈窗 1：建立新專案與選定位置 */}
          {showNewProjectModal && (
            <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/70 backdrop-blur-md p-4 animate-fadeIn">
              <div className="w-full max-w-md rounded-[36px] bg-[#14151f] border border-white/20 p-6 shadow-2xl mb-2">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-bold text-white">步驟 1：設定專案位置與名稱</h2>
                  <button onClick={() => setShowNewProjectModal(false)} className="p-2 rounded-full bg-white/10 text-white/70">
                    <IconX />
                  </button>
                </div>

                <label className="block text-xs text-white/60 mb-1.5 ml-1">選擇儲存分類位置</label>
                <div className="grid grid-cols-3 gap-2 mb-4">
                  {['預設工具箱', '工程速算', '3D 與模型'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setNewProjectCategory(cat)}
                      className={'py-2 px-3 rounded-xl text-xs font-medium border transition-all ' + (
                        newProjectCategory === cat 
                          ? 'bg-blue-500/30 border-blue-400 text-white' 
                          : 'bg-white/5 border-white/10 text-white/50'
                      )}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                <label className="block text-xs text-white/60 mb-1.5 ml-1">專案軟體名稱</label>
                <input
                  type="text"
                  placeholder="輸入軟體名稱 (如：3D Viewer 工具)"
                  value={newProjectTitle}
                  onChange={(e) => setNewProjectTitle(e.target.value)}
                  className="w-full mb-5 px-4 py-3 rounded-2xl bg-white/5 border border-white/15 text-sm text-white placeholder-white/30 focus:outline-none focus:border-blue-400"
                />

                <button
                  onClick={handleCreateProject}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold text-sm shadow-lg active:scale-95 transition-transform"
                >
                  下一步：新增第 1 個程式碼檔案
                </button>
              </div>
            </div>
          )}

          {/* 彈窗 2：貼上程式碼並命名存檔 */}
          {showFileEditor && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fadeIn">
              <div className="w-full max-w-md rounded-[36px] bg-[#14151f] border border-white/20 p-6 shadow-2xl mb-2">
                <div className="flex items-center justify-between mb-3">
                  <h2 className="text-base font-bold text-white">
                    {editingFileIndex !== null ? '編輯檔案內容' : ('新增第 ' + (((studioProject && studioProject.files) || []).length + 1) + ' 個檔案')}
                  </h2>
                  <button onClick={() => setShowFileEditor(false)} className="p-2 rounded-full bg-white/10 text-white/70">
                    <IconX />
                  </button>
                </div>

                <div className="flex items-center gap-1.5 mb-2 overflow-x-auto pb-1">
                  <span className="text-[11px] text-white/50 shrink-0">點選快速命名：</span>
                  {['index.html', 'style.css', 'script.js', 'data.json'].map(preset => (
                    <button
                      key={preset}
                      onClick={() => setFileNameInput(preset)}
                      className="px-2.5 py-1 rounded-lg bg-white/10 border border-white/15 text-[11px] text-blue-300 shrink-0"
                    >
                      {preset}
                    </button>
                  ))}
                </div>

                <input
                  type="text"
                  placeholder="輸入檔案名稱 (例如 index.html)"
                  value={fileNameInput}
                  onChange={(e) => setFileNameInput(e.target.value)}
                  className="w-full mb-3 px-4 py-2.5 rounded-2xl bg-white/5 border border-white/15 text-sm font-mono text-white placeholder-white/30 focus:outline-none focus:border-blue-400"
                />

                <textarea
                  rows={8}
                  placeholder="請在此貼上程式碼..."
                  value={fileContentInput}
                  onChange={(e) => setFileContentInput(e.target.value)}
                  className="w-full mb-4 p-3.5 rounded-2xl bg-white/5 border border-white/15 text-xs font-mono text-white placeholder-white/30 focus:outline-none focus:border-blue-400 resize-none"
                />

                <button
                  onClick={handleSaveFileInStudio}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold text-sm shadow-lg active:scale-95 transition-transform"
                >
                  儲存並命名檔案 (完成後可繼續新增第 2 檔)
                </button>
              </div>
            </div>
          )}

          {/* 全螢幕執行畫面 */}
          {activeProject && (
            <div className="fixed inset-0 z-50 bg-[#050508] flex flex-col animate-fadeIn">
              <iframe
                title={activeProject.title}
                srcDoc={bundleProjectFiles(activeProject)}
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                className="w-full h-full border-0 bg-white"
              />

              {/* 右下角懸浮返回與編輯控制列 */}
              <div className="fixed bottom-5 right-4 z-50 flex items-center gap-1.5">
                {miniFloatingBtn ? (
                  <button
                    onClick={() => setMiniFloatingBtn(false)}
                    className="w-10 h-10 rounded-full bg-black/60 text-white backdrop-blur-xl border border-white/25 shadow-lg flex items-center justify-center text-xs font-bold"
                  >
                    •••
                  </button>
                ) : (
                  <div className="flex items-center gap-1.5 p-1.5 rounded-full bg-black/80 backdrop-blur-2xl border border-white/25 shadow-2xl">
                    <button
                      onClick={() => setActiveProject(null)}
                      className="flex items-center gap-1 pl-2.5 pr-3 py-1.5 rounded-full bg-white/15 text-white text-xs font-semibold"
                    >
                      <IconChevronLeft />
                      <span>返回清單</span>
                    </button>
                    <button
                      onClick={() => {
                        const proj = activeProject;
                        setActiveProject(null);
                        setStudioProject(proj);
                      }}
                      className="px-3 py-1.5 rounded-full bg-blue-500 text-white text-xs font-semibold"
                    >
                      專案檔案
                    </button>
                    <button
                      onClick={() => setMiniFloatingBtn(true)}
                      className="p-1.5 rounded-full text-white/60"
                    >
                      <IconX />
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
