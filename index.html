<!doctype html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HTML Space" />
  <link rel="manifest" href="/manifest.json" />
  <title>HTML Space - iOS 27</title>
  <!-- Tailwind CSS & React CDN (免編譯直跑) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    .animate-fadeIn { animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="bg-[#050508] text-white antialiased selection:bg-blue-500 selection:text-white overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- IndexedDB 儲存引擎 (突破 localStorage 5MB 限制) ---
    const DB_NAME = 'iOS27_HTML_DB';
    const STORE_NAME = 'history';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveRecordToDB = async (record) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getAllRecordsFromDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const request = tx.objectStore(STORE_NAME).getAll();
        request.onsuccess = () => {
          const sorted = request.result.sort((a, b) => b.lastOpened - a.lastOpened);
          resolve(sorted);
        };
        request.onerror = () => reject(request.error);
      });
    };

    const deleteRecordFromDB = async (id) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // --- 內建 SVG 圖示元件 ---
    const IconFolder = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z" /></svg>
    );
    const IconCode = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" /></svg>
    );
    const IconClock = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6l4 2" /></svg>
    );
    const IconTrash = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    );
    const IconPlay = () => (
      <svg className="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
    );
    const IconPlus = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
    );
    const IconX = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
    );
    const IconChevronLeft = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>
    );
    const IconSparkles = () => (
      <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
    );

    function App() {
      const [history, setHistory] = useState([]);
      const [activeHtml, setActiveHtml] = useState(null);
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pasteTitle, setPasteTitle] = useState('');
      const [pasteContent, setPasteContent] = useState('');
      const fileInputRef = useRef(null);

      useEffect(() => {
        loadHistory();
      }, []);

      const loadHistory = async () => {
        const data = await getAllRecordsFromDB();
        setHistory(data);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const content = event.target.result;
          const newRecord = {
            id: Date.now().toString(),
            title: file.name.replace(/\.html?$/i, ''),
            fileName: file.name,
            content: content,
            size: (file.size / 1024).toFixed(1) + ' KB',
            lastOpened: Date.now(),
          };
          await saveRecordToDB(newRecord);
          await loadHistory();
          setActiveHtml(newRecord);
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      const handlePasteSubmit = async () => {
        if (!pasteContent.trim()) return;
        const title = pasteTitle.trim() || `快速草稿 ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        const blobSize = new Blob([pasteContent]).size;
        
        const newRecord = {
          id: Date.now().toString(),
          title: title,
          fileName: `${title}.html`,
          content: pasteContent,
          size: (blobSize / 1024).toFixed(1) + ' KB',
          lastOpened: Date.now(),
        };
        await saveRecordToDB(newRecord);
        await loadHistory();
        setPasteTitle('');
        setPasteContent('');
        setShowPasteModal(false);
        setActiveHtml(newRecord);
      };

      const openFromHistory = async (item) => {
        const updated = { ...item, lastOpened: Date.now() };
        await saveRecordToDB(updated);
        await loadHistory();
        setActiveHtml(updated);
      };

      const handleDelete = async (e, id) => {
        e.stopPropagation();
        await deleteRecordFromDB(id);
        await loadHistory();
      };

      return (
        <div className="relative w-screen h-screen overflow-hidden bg-[#050508] select-none font-sans">
          {/* iOS 27 空間動態極光背景 */}
          <div className="absolute -top-32 -left-32 w-96 h-96 bg-blue-600/30 rounded-full blur-[120px] pointer-events-none animate-pulse" />
          <div className="absolute top-1/3 -right-32 w-96 h-96 bg-purple-600/25 rounded-full blur-[130px] pointer-events-none" />
          <div className="absolute -bottom-32 left-1/4 w-96 h-96 bg-cyan-500/20 rounded-full blur-[110px] pointer-events-none" />

          <input
            ref={fileInputRef}
            type="file"
            accept=".html,.htm"
            onChange={handleFileUpload}
            className="hidden"
          />

          {/* 自動適配 iPhone 動態島與狀態列高度 (Safe Area Inset Top) */}
          <div 
            className="relative z-10 flex flex-col h-full pb-28 px-5 max-w-md mx-auto"
            style={{ paddingTop: 'calc(env(safe-area-inset-top, 48px) + 24px)' }}
          >
            <header className="mb-6 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-1.5 text-xs font-medium text-blue-400/90 tracking-widest uppercase mb-1">
                  <IconSparkles />
                  <span>iOS 27 Spatial Engine</span>
                </div>
                <h1 className="text-3xl font-bold tracking-tight bg-gradient-to-br from-white via-white/90 to-white/50 bg-clip-text text-transparent">
                  HTML 空間檢視器
                </h1>
              </div>
              <div className="px-3 py-1.5 rounded-full bg-white/5 backdrop-blur-xl border border-white/15 text-xs text-white/70 shadow-inner">
                {history.length} 筆紀錄
              </div>
            </header>

            <div className="grid grid-cols-2 gap-3.5 mb-7">
              <button
                onClick={() => fileInputRef.current?.click()}
                className="group relative flex flex-col justify-between p-4 h-28 rounded-[28px] bg-white/[0.07] hover:bg-white/[0.12] active:scale-95 transition-all duration-300 backdrop-blur-2xl border border-white/15 shadow-[0_8px_32px_rgba(0,0,0,0.4)] overflow-hidden text-left"
              >
                <div className="w-10 h-10 rounded-2xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-400 group-hover:scale-110 transition-transform">
                  <IconFolder />
                </div>
                <div>
                  <div className="font-semibold text-sm text-white/95">開啟本機檔案</div>
                  <div className="text-[11px] text-white/50">選取手機內的 .html</div>
                </div>
              </button>

              <button
                onClick={() => setShowPasteModal(true)}
                className="group relative flex flex-col justify-between p-4 h-28 rounded-[28px] bg-white/[0.07] hover:bg-white/[0.12] active:scale-95 transition-all duration-300 backdrop-blur-2xl border border-white/15 shadow-[0_8px_32px_rgba(0,0,0,0.4)] overflow-hidden text-left"
              >
                <div className="w-10 h-10 rounded-2xl bg-purple-500/20 border border-purple-400/30 flex items-center justify-center text-purple-400 group-hover:scale-110 transition-transform">
                  <IconCode />
                </div>
                <div>
                  <div className="font-semibold text-sm text-white/95">貼上原始碼</div>
                  <div className="text-[11px] text-white/50">剪貼簿快速渲染</div>
                </div>
              </button>
            </div>

            <div className="flex items-center justify-between mb-3 px-1">
              <div className="flex items-center gap-1.5 text-xs font-semibold text-white/60 tracking-wider uppercase">
                <IconClock />
                <span>最近開啟紀錄</span>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto space-y-3 pr-1 pb-6">
              {history.length === 0 ? (
                <div className="h-56 rounded-[32px] bg-white/[0.03] backdrop-blur-xl border border-white/10 flex flex-col items-center justify-center text-center p-6">
                  <IconCode className="w-10 h-10 text-white/20 mb-3" />
                  <p className="text-sm text-white/60 font-medium">尚無開啟紀錄</p>
                  <p className="text-xs text-white/35 mt-1">上傳或貼上的 HTML 會自動保存在手機中，隨時點擊即可秒開</p>
                </div>
              ) : (
                history.map((item) => (
                  <div
                    key={item.id}
                    onClick={() => openFromHistory(item)}
                    className="group relative flex items-center justify-between p-4 rounded-[26px] bg-white/[0.06] hover:bg-white/[0.11] active:scale-[0.98] transition-all duration-200 backdrop-blur-2xl border border-white/15 shadow-lg cursor-pointer"
                  >
                    <div className="flex items-center gap-3.5 min-w-0 pr-3">
                      <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-500/20 to-purple-500/20 border border-white/15 flex items-center justify-center text-blue-300 shrink-0">
                        <IconPlay />
                      </div>
                      <div className="min-w-0">
                        <h3 className="font-semibold text-sm text-white/95 truncate">{item.title}</h3>
                        <div className="flex items-center gap-2 text-[11px] text-white/45 mt-0.5">
                          <span>{item.size}</span>
                          <span>•</span>
                          <span>{new Date(item.lastOpened).toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                      </div>
                    </div>

                    <button
                      onClick={(e) => handleDelete(e, item.id)}
                      className="p-2.5 rounded-full bg-white/5 hover:bg-red-500/20 text-white/40 hover:text-red-400 active:scale-90 transition-all shrink-0"
                      title="刪除紀錄"
                    >
                      <IconTrash />
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* 底部懸浮膠囊列 (自動避開 iPhone Home Indicator) */}
          <div 
            className="fixed inset-x-0 z-20 flex justify-center pointer-events-none"
            style={{ bottom: 'calc(env(safe-area-inset-bottom, 16px) + 12px)' }}
          >
            <div className="pointer-events-auto flex items-center gap-2 px-3 py-2 rounded-full bg-white/10 backdrop-blur-3xl border border-white/20 shadow-[0_10px_40px_rgba(0,0,0,0.6)]">
              <button
                onClick={() => fileInputRef.current?.click()}
                className="flex items-center gap-2 px-5 py-2.5 rounded-full bg-blue-500 hover:bg-blue-400 active:scale-95 text-white text-xs font-semibold shadow-lg shadow-blue-500/30 transition-all"
              >
                <IconPlus />
                <span>開啟 HTML</span>
              </button>
              <button
                onClick={() => setShowPasteModal(true)}
                className="px-4 py-2.5 rounded-full text-white/80 hover:text-white hover:bg-white/10 active:scale-95 text-xs font-medium transition-all"
              >
                貼上代碼
              </button>
            </div>
          </div>

          {showPasteModal && (
            <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-md p-4 animate-fadeIn">
              <div className="w-full max-w-md rounded-[36px] bg-[#12131a]/90 backdrop-blur-3xl border border-white/20 p-6 shadow-2xl mb-4">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-bold text-white">貼上 HTML 原始碼</h2>
                  <button
                    onClick={() => setShowPasteModal(false)}
                    className="p-2 rounded-full bg-white/10 text-white/70 hover:text-white"
                  >
                    <IconX />
                  </button>
                </div>
                <input
                  type="text"
                  placeholder="輸入紀錄名稱 (選填，方便日後查找)"
                  value={pasteTitle}
                  onChange={(e) => setPasteTitle(e.target.value)}
                  className="w-full mb-3 px-4 py-3 rounded-2xl bg-white/5 border border-white/15 text-sm text-white placeholder-white/30 focus:outline-none focus:border-blue-400"
                />
                <textarea
                  rows={8}
                  placeholder="在此貼上 <!DOCTYPE html>... 完整代碼"
                  value={pasteContent}
                  onChange={(e) => setPasteContent(e.target.value)}
                  className="w-full mb-4 p-4 rounded-2xl bg-white/5 border border-white/15 text-xs font-mono text-white placeholder-white/30 focus:outline-none focus:border-blue-400 resize-none"
                />
                <button
                  onClick={handlePasteSubmit}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold text-sm shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-transform"
                >
                  立即渲染並儲存紀錄
                </button>
              </div>
            </div>
          )}

          {activeHtml && (
            <div className="fixed inset-0 z-50 bg-white flex flex-col animate-fadeIn">
              <div 
                className="fixed left-4 z-50"
                style={{ top: 'calc(env(safe-area-inset-top, 44px) + 12px)' }}
              >
                <button
                  onClick={() => setActiveHtml(null)}
                  className="flex items-center gap-1.5 pl-3 pr-4 py-2 rounded-full bg-black/65 hover:bg-black/80 active:scale-95 text-white backdrop-blur-2xl border border-white/25 shadow-[0_4px_20px_rgba(0,0,0,0.4)] transition-all"
                >
                  <IconChevronLeft />
                  <span className="text-xs font-semibold max-w-[140px] truncate">{activeHtml.title}</span>
                </button>
              </div>

              <iframe
                title={activeHtml.title}
                srcDoc={activeHtml.content}
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
                className="w-full h-full border-0"
              />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
